[package]
name = "sshx"
version = "0.1.2"
edition = "2024"
rust-version = "1.95.0"

[lib]
name = "sshx"
path = "src/lib.rs"

[[bin]]
name = "sshx"
path = "src/main.rs"

[dependencies]
libc = "0.2"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
