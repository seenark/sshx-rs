name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openssh-client sshpass
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install sshpass
          command -v ssh
          command -v sshpass
      - run: mise exec -- cargo fmt --all -- --check
      - run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings
      - run: mise exec -- cargo test --all-targets --all-features
      - run: mise exec -- ./scripts/test-release-package.sh

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Check tag matches package version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(mise exec -- cargo metadata --no-deps --format-version=1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "$package_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install target
        run: mise exec -- rustup target add "${{ matrix.target }}"
      - name: Build release binary
        run: mise exec -- cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package release asset
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}" dist
      - name: Verify release asset
        run: ./scripts/verify-release-archive.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(
            for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
              printf '%s\n' "sshx-v${version}-${target}.tar.gz" "sshx-v${version}-${target}.tar.gz.sha256"
            done | sort
          )"
          actual="$(find dist -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          uploaded="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          test "$uploaded" = "$expected"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  mise-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04-arm, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      HOME: ${{ runner.temp }}/sshx-mise-home
      XDG_CONFIG_HOME: ${{ runner.temp }}/sshx-xdg-config
      XDG_DATA_HOME: ${{ runner.temp }}/sshx-xdg-data
      MISE_CONFIG_DIR: ${{ runner.temp }}/sshx-mise-config
      MISE_DATA_DIR: ${{ runner.temp }}/sshx-mise-data
      MISE_CACHE_DIR: ${{ runner.temp }}/sshx-mise-cache
      MISE_STATE_DIR: ${{ runner.temp }}/sshx-mise-state
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: '1'
    steps:
      - name: Create isolated mise directories
        run: mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$MISE_CONFIG_DIR" "$MISE_DATA_DIR" "$MISE_CACHE_DIR" "$MISE_STATE_DIR"
      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          cache_save: false
          mise_dir: ${{ runner.temp }}/sshx-mise-data
      - name: Install published release in fresh mise environment
        working-directory: ${{ env.HOME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mise use -g github:seenark/sshx-rs
          selected="$(mise which sshx)"
          case "$selected" in
            "$MISE_DATA_DIR"/installs/*) ;;
            *) printf 'sshx resolved outside isolated mise install: %s\n' "$selected" >&2; exit 1 ;;
          esac
          test -x "$selected"
          test "$(mise exec -- sh -c 'command -v sshx')" = "$selected"
          test "$(mise exec -- sshx --version)" = "sshx $version"
          mise use -g "github:seenark/sshx-rs@$version"
          test "$(mise exec -- sshx --version)" = "sshx $version"
